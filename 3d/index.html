*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block}.hud{position:fixed;z-index:4;inset:max(10px,env(safe-area-inset-top)) 12px auto;display:flex;justify-content:space-between;direction:ltr;text-shadow:0 2px 6px #000}.brand b{display:block;color:#ffc64a;font-size:11px;letter-spacing:1.4px}.brand small{color:#9db2bf}.stats{display:flex;gap:6px}.pill{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;padding:6px 10px;text-align:center;min-width:57px}.pill b{display:block;color:#4ee5ec;font-size:18px}.pill small{font-size:8px}.wanted{position:fixed;z-index:5;top:67px;left:14px;direction:ltr;color:#38434c;font-size:18px}.wanted .on{color:#ffc64a;text-shadow:0 0 10px #ffc64a}.joy{position:fixed;z-index:5;left:20px;bottom:max(22px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #ffffff28;border-radius:50%;background:#07101aaa}.knob{position:absolute;left:30px;top:30px;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#68edf1,#16899c);display:grid;place-items:center}.turbo{position:fixed;z-index:5;right:22px;bottom:max(40px,env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:2px solid #ffc64a66;background:#2b1d08dd;color:#ffc64a;font-weight:bold;font-size:12px}.alert{position:fixed;z-index:6;top:103px;left:50%;transform:translateX(-50%);background:#d52d4add;padding:7px 14px;border-radius:18px;font-size:11px;font-weight:bold;opacity:0;transition:.2s;white-space:nowrap}.alert.on{opacity:1}.panel{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#05090d88}.panel.hide{display:none}.card{width:min(350px,92vw);padding:28px 23px;text-align:center;border:1px solid #ffffff25;border-radius:24px;background:linear-gradient(145deg,#12202df5,#07101af5);box-shadow:0 25px 70px #00 </style></head><body><div id="mount"></div><div class="hud"><div class="brand"><b>YEHUDA CITY 3D • V8.1</b><small>LOW-POLY NIGHT RUN</small></div><div class="stats"><div class="pill"><b id="coins">0</b><small>מטבעות</small></div><div class="pill"><b id="score">0</b><small>ניקוד</small></div></div></div><div class="wanted" id="wanted"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="alert" id="alert"></div><div class="joy" id="joy"><div class="knob" id="knob">↑</div></div><button class="turbo" id="turbo">טורבו<br>🔥</button><a class="back" href="../?v=8.1">דו־ממד</a><div class="panel" id="start"><div class="card"><div class="tag">REAL 3D MODE</div><div class="logo">🏙️</div><h1>יהודה סיטי 3D</h1><p>סע בעיר תלת־ממדית, אסוף מטבעות<br>והתחמק מניידות המשטרה.</p><div class="features"><span>🎥 מצלמה מאחור</span><span>🚓 מרדף 3D</span><span>🕹️ אותה שליטה</span></div><button class="start" id="go">צא לדרך 🏁</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);scene.fog=new THREE.Fog(0x071018,80,290);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,600),renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('#mount').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8fb8db,0x172016,1.6));const sun=new THREE.DirectionalLight(0xffe2b4,1.6);sun.position.set(-40,70,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;scene.add(sun);const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const asphalt=mat(0x10161c),sidewalk=mat(0x46515a),grass=mat(0x18251f),lane=mat(0xc6a74c);let blocks=[],police=[],pickups=[],lamps=[],started=false,time=0,score=0,coinCount=0,wanted=1,boost=false,joy={x:0,y:0,on:false,id:null};
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}for(let i=-4;i<=4;i++){box(500,.15,16,0x11171d,0,.08,i*50);box(16,.15,500,0x11171d,i*50,.08,0);for(let j=-5;j<=5;j++){box(3,.02,.3,0xd1ac4d,j*25,.17,i*50);box(.3,.02,3,0xd1ac4d,i*50,.17,j*25)}}for(let gx=-4;gx<4;gx++)for(let gz=-4;gz<4;gz++){let cx=gx*50+25,cz=gz*50+25;if(Math.abs(cx%50)<12||Math.abs(cz%50)<12)continue;box(32,.35,32,0x47515a,cx,.18,cz);let h=13+((gx*37+gz*19+100)%24),colors=[0x263d48,0x36434f,0x3c3449,0x30483e],b=box(27,h,27,colors[Math.abs(gx+gz)%4],cx,h/2+.4,cz);for(let y=3;y<h-2;y+=4)for(let a=-9;a<=9;a+=6){let lit=((a+y+gx*3+gz)%4===0),wm=mat(lit?0xffd06b:0x16313a);for(const side of [-1,1]){let w=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.6),wm);w.position.set(cx+a,y,cz+side*13.52);if(side<0)w.rotation.y=Math.PI;scene.add(w)}}}
function streetLamp(x,z){let g=new THREE.Group(),pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,5,6),mat(0x59636a));pole.position.y=2.5;g.add(pole);let bulb=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),new THREE.MeshBasicMaterial({color:0xffdb77}));bulb.position.y=5;g.add(bulb);let light=new THREE.PointLight(0xffc866,1.3,18,2);light.position.y=4.8;g.add(light);g.position.set(x,0,z);scene.add(g);lamps.push(g)}for(let i=-4;i<=4;i++)for(let j=-3;j<=3;j++){streetLamp(i*50+10,j*50+10);streetLamp(i*50-10,j*50-10)}
function makeCar(color=0x42d8e5,pol=false){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.05,6),mat(pol?0xe8edf1:color));body.position.y=1;body.castShadow=true;g.add(body);let cab=new THREE.Mesh(new THREE.BoxGeometry(2.65,1,2.8),mat(0x17313c));cab.position.set(0,1.8,.15);cab.castShadow=true;g.add(cab);for(const x of [-1.55,1.55])for(const z of [-1.8,1.8]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.42,10),mat(0x08090a));w.rotation.z=Math.PI/2;w.position.set(x,.62,z);g.add(w)}if(pol){let bar=new THREE.Mesh(new THREE.BoxGeometry(2.2,.25,.45),mat(0xeeeeee));bar.position.set(0,2.42,.1);g.add(bar);let r=new THREE.PointLight(0xff204c,2,9),b=new THREE.PointLight(0x207dff,2,9);r.position.set(-.65,2.55,.1);b.position.set(.65,2.55,.1);g.add(r,b);g.userData.lights=[r,b]}scene.add(g);return g}const player=makeCar();player.position.set(0,0,0);let yaw=0,speed=0;function spawnPolice(){let p=makeCar(0xffffff,true),a=Math.random()*Math.PI*2,d=42+Math.random()*20;p.position.set(player.position.x+Math.cos(a)*d,0,player.position.z+Math.sin(a)*d);p.userData={speed:11+Math.random()*3,hp:100,hit:0,lights:p.userData.lights};police.push(p)}function spawnCoin(){let m=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.25,16),new THREE.MeshStandardMaterial({color:0xffc83d,emissive:0x8a5500,metalness:.65,roughness:.3}));m.rotation.z=Math.PI/2;let a=Math.random()*Math.PI*2,d=28+Math.random()*60;m.position.set(player.position.x+Math.cos(a)*d,1.1,player.position.z+Math.sin(a)*d);scene.add(m);pickups.push(m)}for(let i=0;i<10;i++)spawnCoin();spawnPolice();const head1=new THREE.SpotLight(0xfff3c4,7,38,.35,.55,1.5),head2=head1.clone();head1.position.set(-.85,1.1,-2.8);head2.position.set(.85,1.1,-2.8);head1.target.position.set(-.85,.1,-20);head2.target.position.set(.85,.1,-20);player.add(head1,head2,head1.target,head2.target);
function pop(t){let a=$('#alert');a.textContent=t;a.classList.add('on');clearTimeout(a.t);a.t=setTimeout(()=>a.classList.remove('on'),1100)}function setWanted(n){wanted=n;[...$('#wanted').children].forEach((s,i)=>s.classList.toggle('on',i<n))}function drive(dt){let mag=Math.min(1,Math.hypot(joy.x,joy.y));if(joy.on&&mag>.12){let desired=Math.atan2(joy.x,-joy.y),diff=((desired-yaw+Math.PI*3)%(Math.PI*2))-Math.PI;yaw+=diff*Math.min(1,dt*5);speed+=( (boost?31:19)*mag-speed)*Math.min(1,dt*5)}else speed*=Math.pow(.86,dt*60);player.rotation.y=yaw;player.position.x+=Math.sin(yaw)*speed*dt;player.position.z-=Math.cos(yaw)*speed*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-220,220);player.position.z=THREE.MathUtils.clamp(player.position.z,-220,220)}function update(dt){time+=dt;drive(dt);score=Math.floor(time*3+coinCount*100);$('#score').textContent=score;let newWanted=Math.min(5,1+Math.floor(time/28));if(newWanted!==wanted){setWanted(newWanted);spawnPolice();pop('🚨 רמת המבוקשות עלתה')}for(let i=pickups.length-1;i>=0;i--){let q=pickups[i];q.rotation.y+=dt*3;q.position.y=1.1+Math.sin(time*3+i)*.2;if(q.position.distanceTo(player.position)<3.2){scene.remove(q);pickups.splice(i,1);coinCount++;$('#coins').textContent=coinCount;pop('🪙 מטבע! +100');spawnCoin()}}for(let i=police.length-1;i>=0;i--){let p=police[i],dx=player.position.x-p.position.x,dz=player.position.z-p.position.z,a=Math.atan2(dx,-dz);p.rotation.y=a;p.position.x+=Math.sin(a)*p.userData.speed*dt;p.position.z-=Math.cos(a)*p.userData.speed*dt;if(p.userData.lights){p.userData.lights[0].intensity=Math.sin(time*16)>0?3:.2;p.userData.lights[1].intensity=Math.sin(time*16)>0?.2:3}p.userData.hit-=dt;if(p.position.distanceTo(player.position)<4&&p.userData.hit<=0){p.userData.hit=.7;p.userData.hp-=boost?100:55;p.position.add(new THREE.Vector3(-dx,0,-dz).normalize().multiplyScalar(5));pop(boost?'🔥 ניגוח טורבו!':'🚓 ניגוח בניידת!');if(p.userData.hp<=0){scene.remove(p);police.splice(i,1);score+=200;setTimeout(spawnPolice,1700)}}}while(police.length<wanted)spawnPolice();let target=new THREE.Vector3(player.position.x-Math.sin(yaw)*11,7,player.position.z+Math.cos(yaw)*11);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,1.2,player.position.z)}let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(started)update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}camera.position.set(0,7,12);camera.lookAt(0,1,0);requestAnimationFrame(loop);function joyMove(e){let r=$('#joy').getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/39,dy=(e.clientY-r.top-r.height/2)/39,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}joy.x=dx;joy.y=dy;$('#knob').style.transform=`translate(${dx*28}px,${dy*28}px)`}renderer.domElement.addEventListener('pointerdown',e=>{if(!started||e.clientX>innerWidth*.65)return;joy.on=true;joy.id=e.pointerId;joyMove(e);try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});renderer.domElement.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id)joyMove(e)},{passive:false});addEventListener('pointerup',e=>{if(e.pointerId===joy.id){joy.on=false;joy.x=joy.y=0;$('#knob').style.transform=''}boost=false});$('#turbo').addEventListener('pointerdown',e=>{e.preventDefault();boost=true});$('#go').onclick=()=>{started=true;$('#start').classList.add('hide');pop('🏙️ ברוך הבא לעיר 3D')};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setWanted(1)})();
</script></body></html>
