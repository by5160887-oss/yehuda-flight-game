<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050b18"><title>טיסת יהודה | Yehuda Travel Group</title><style>
:root{--gold:#f4c65d;--cyan:#57dce9;--ink:#f8f6ec}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b18;color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;touch-action:none;user-select:none}canvas{display:block}.top{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 12px #000}.brand{direction:ltr;text-align:left}.brand b{display:block;color:var(--gold);font-size:11px;letter-spacing:1.7px}.brand span{color:#9fbdca;font-size:9px;letter-spacing:1px}.stats{display:flex;gap:7px}.pill{min-width:61px;padding:7px 9px;text-align:center;border-radius:14px;border:1px solid #ffffff25;background:#061328ad;backdrop-filter:blur(8px)}.pill b{display:block;color:var(--cyan);font-size:20px;line-height:1}.pill small{font-size:9px;color:#c2d0d7}.panel{position:fixed;z-index:9;inset:0;padding:20px;display:grid;place-items:center;transition:.25s;pointer-events:none}.card{pointer-events:auto;width:min(350px,92vw);padding:27px 21px 23px;text-align:center;border:1px solid #ffffff25;border-radius:26px;background:linear-gradient(155deg,#0b1d35ee,#07101eee);box-shadow:0 25px 80px #000b,inset 0 1px #ffffff18;backdrop-filter:blur(12px);animation:rise .45s ease-out}.hidden{opacity:0;visibility:hidden;transform:scale(.98)}.eyebrow{direction:ltr;color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:2px}.plane{font-size:56px;margin:9px 0 1px;filter:drop-shadow(0 8px 12px #0008);transform:rotate(-12deg)}h1{color:var(--gold);font-size:38px;letter-spacing:-1px;margin:0}.sub{font-size:14px;line-height:1.6;color:#b8cad4;margin:7px 0 18px}.startBtn{width:100%;min-height:55px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold),#eaa03b);color:#181107;font-size:18px;font-weight:900;box-shadow:0 11px 32px #e6aa3944}.startBtn:active{transform:scale(.97)}.tip{color:#7895a5;font-size:10px;margin:12px 0 0}.how{display:flex;justify-content:center;gap:8px;margin:0 0 17px}.how span{padding:7px 9px;border:1px solid #ffffff13;border-radius:10px;background:#ffffff09;color:#a9c0cc;font-size:10px}.result{display:flex;justify-content:center;gap:10px;margin:17px 0}.result div{width:102px;padding:10px;border:1px solid #ffffff13;background:#ffffff09;border-radius:15px}.result b{display:block;color:var(--gold);font-size:28px}.result span{font-size:10px;color:#91a9b8}.newbest{height:18px;color:var(--cyan);font-size:12px;font-weight:bold}.dragHint{position:fixed;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#06132899;color:#b7d0d9;font-size:10px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}.dragHint.show{opacity:1}@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}@media(max-height:630px){.card{padding:18px}.plane{font-size:42px;margin:2px}h1{font-size:31px}.sub{margin:4px 0 10px}.how{margin-bottom:10px}}
</style></head><body>
<div class="top"><div class="brand"><b>YEHUDA TRAVEL GROUP</b><span>FLY SMART • TRAVEL FAR</span></div><div class="stats"><div class="pill"><b id="score">0</b><small>ניקוד</small></div><div class="pill"><b id="best">0</b><small>שיא</small></div></div></div><div class="dragHint" id="hint">גרור עם האגודל כדי להטיס ✈️</div>
<div class="panel" id="start"><div class="card"><div class="eyebrow">3D ENDLESS FLIGHT</div><div class="plane">✈️</div><h1>טיסת יהודה</h1><p class="sub">טוסו בין המגדלים, עברו בשערי הזהב<br>והגיעו הכי רחוק שאפשר.</p><div class="how"><span>↔️ ימינה ושמאלה</span><span>↕️ למעלה ולמטה</span></div><button class="startBtn" id="startBtn">להמראה 🚀</button><p class="tip">משחק תלת־ממד • מיועד לטלפון</p></div></div>
<div class="panel hidden" id="over"><div class="card"><div class="eyebrow">הטיסה הסתיימה</div><div class="plane">🛬</div><h1 style="font-size:31px">נחיתה בעיר</h1><div class="result"><div><b id="final">0</b><span>ניקוד</span></div><div><b id="finalBest">0</b><span>שיא</span></div></div><div class="newbest" id="newbest"></div><button class="startBtn" id="restartBtn">משחק חדש ↻</button><p class="tip">עוד טיסה אחת ודי 😉</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),start=$('#start'),over=$('#over'),hint=$('#hint');let scene,camera,renderer,plane,world,lights,mode='ready',score=0,best=+(localStorage.getItem('yehuda3DBest')||0),target={x:0,y:2.6},speed=18,items=[],clouds=[],clock=new THREE.Clock(),spawn=0,drag=false,trail=[];$('#best').textContent=best;
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x061126);scene.fog=new THREE.Fog(0x071126,24,105);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);camera.position.set(0,5.6,10);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8eeeff,0x081020,2.4));const sun=new THREE.DirectionalLight(0xffd77a,2.2);sun.position.set(-8,15,8);scene.add(sun);world=new THREE.Group();scene.add(world);makePlane();makeWorld();addEventListener('resize',resize);renderer.domElement.addEventListener('pointerdown',down);renderer.domElement.addEventListener('pointermove',move);addEventListener('pointerup',()=>drag=false);animate()}
function makePlane(){plane=new THREE.Group();const white=new THREE.MeshStandardMaterial({color:0xf2f5f7,metalness:.35,roughness:.35}),gold=new THREE.MeshStandardMaterial({color:0xf2bf4e,metalness:.55,roughness:.28}),cyan=new THREE.MeshStandardMaterial({color:0x38cbd8,emissive:0x0b5360,emissiveIntensity:.7});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,1.55,5,10),white);body.rotation.x=Math.PI/2;plane.add(body);const wing=new THREE.Mesh(new THREE.BoxGeometry(2.25,.08,.62),gold);wing.position.z=.05;plane.add(wing);const tail=new THREE.Mesh(new THREE.BoxGeometry(.85,.08,.35),cyan);tail.position.z=.72;plane.add(tail);const fin=new THREE.Mesh(new THREE.BoxGeometry(.08,.48,.35),cyan);fin.position.set(0,.25,.72);plane.add(fin);const nose=new THREE.Mesh(new THREE.ConeGeometry(.29,.55,12),gold);nose.rotation.x=-Math.PI/2;nose.position.z=-1.06;plane.add(nose);plane.position.set(0,2.6,3);scene.add(plane);for(let i=0;i<12;i++){const dot=new THREE.Mesh(new THREE.SphereGeometry(.035,5,5),new THREE.MeshBasicMaterial({color:0x57dce9,transparent:true,opacity:.5}));dot.position.set(0,2.6,3+i*.36);scene.add(dot);trail.push(dot)}}
function makeWorld(){const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,260,1,1),new THREE.MeshStandardMaterial({color:0x071a25,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-80);world.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(6,260),new THREE.MeshBasicMaterial({color:0x0b2732}));road.rotation.x=-Math.PI/2;road.position.set(0,.012,-80);world.add(road);for(let z=5;z>-150;z-=7){const mark=new THREE.Mesh(new THREE.PlaneGeometry(.12,2.4),new THREE.MeshBasicMaterial({color:0x57dce8,transparent:true,opacity:.35}));mark.rotation.x=-Math.PI/2;mark.position.set(0,.02,z);world.add(mark)}for(let i=0;i<38;i++)building((i%2?1:-1)*(7+Math.random()*18),-i*5-Math.random()*9,1.5+Math.random()*3,2+Math.random()*10,true);for(let i=0;i<15;i++)clouds.push(cloud((Math.random()-.5)*38,8+Math.random()*10,-Math.random()*120))}
function building(x,z,w,h,decor){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.55+Math.random()*.05,.35,.12+Math.random()*.08),roughness:.7}),b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat);b.position.y=h/2;g.add(b);if(decor){const win=new THREE.MeshBasicMaterial({color:Math.random()>.45?0xf0c35a:0x49cbd9,transparent:true,opacity:.55});for(let y=1;y<h-.4;y+=1.25)for(const sx of[-.28,.28]){const m=new THREE.Mesh(new THREE.PlaneGeometry(.22,.35),win);m.position.set(sx*w,y,w/2+.01);g.add(m)}}g.position.set(x,0,z);world.add(g);return g}
function cloud(x,y,z){const g=new THREE.Group(),m=new THREE.MeshBasicMaterial({color:0xc8f5ff,transparent:true,opacity:.09});for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random(),8,6),m);s.position.set(i*1.3,(i%2)*.5,0);s.scale.y=.55;g.add(s)}g.position.set(x,y,z);world.add(g);return g}
function ring(x,y,z){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xf3c45a,emissive:0x8b5700,emissiveIntensity:1.1,metalness:.7,roughness:.25}),r=new THREE.Mesh(new THREE.TorusGeometry(2.05,.18,8,28),mat);g.add(r);for(let i=0;i<4;i++){const orb=new THREE.Mesh(new THREE.SphereGeometry(.11,7,7),new THREE.MeshBasicMaterial({color:0x57dce9}));orb.position.set(Math.cos(i*Math.PI/2)*2.05,Math.sin(i*Math.PI/2)*2.05,0);g.add(orb)}g.position.set(x,y,z);world.add(g);items.push({kind:'ring',o:g,z,hit:false});}
function obstacle(z){const side=Math.random()>.5?1:-1,x=side*(1.4+Math.random()*2.5),w=1.7+Math.random()*1.4,h=3.4+Math.random()*4.6,b=building(x,z,w,h,false);const beacon=new THREE.Mesh(new THREE.SphereGeometry(.13,7,7),new THREE.MeshBasicMaterial({color:0xff4c65}));beacon.position.y=h+.18;b.add(beacon);items.push({kind:'building',o:b,z,w,h,x});if(Math.random()>.45)ring(-side*(.3+Math.random()*1.8),2.8+Math.random()*2.8,z-8)}
function reset(){items.forEach(i=>world.remove(i.o));items=[];score=0;speed=18;spawn=0;target={x:0,y:2.8};plane.position.set(0,2.8,3);plane.rotation.set(0,0,0);$('#score').textContent=0;for(let z=-25;z>-105;z-=18+Math.random()*6)obstacle(z)}
function begin(){reset();mode='play';clock.getDelta();start.classList.add('hidden');over.classList.add('hidden');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),2200)}
function down(e){if(mode!=='play')return;drag=true;steer(e)}function move(e){if(drag&&mode==='play')steer(e)}function steer(e){target.x=(e.clientX/innerWidth-.5)*10;target.y=1.15+(1-e.clientY/innerHeight)*6.4}
function finish(){if(mode!=='play')return;mode='over';if(score>best){best=score;localStorage.setItem('yehuda3DBest',best);$('#newbest').textContent='✨ שיא חדש!'}else $('#newbest').textContent='';$('#best').textContent=best;$('#final').textContent=score;$('#finalBest').textContent=best;hint.classList.remove('show');setTimeout(()=>over.classList.remove('hidden'),280)}
function update(dt){if(mode!=='play')return;speed=Math.min(30,18+score*.45);plane.position.x+=(target.x-plane.position.x)*Math.min(1,dt*5.5);plane.position.y+=(target.y-plane.position.y)*Math.min(1,dt*5.5);plane.rotation.z=-(target.x-plane.position.x)*.085;plane.rotation.x=(target.y-plane.position.y)*.035;spawn+=speed*dt;for(const i of items){i.o.position.z+=speed*dt;i.z=i.o.position.z;if(i.kind==='ring'){i.o.rotation.z+=dt*.8;if(!i.hit&&i.z>2.7){i.hit=true;if(Math.hypot(plane.position.x-i.o.position.x,plane.position.y-i.o.position.y)<1.72){score+=2;$('#score').textContent=score}}}else if(i.z>1.8&&i.z<4.4&&Math.abs(plane.position.x-i.x)<i.w/2+.5&&plane.position.y<i.h+.35)finish();}if(plane.position.y<.55||Math.abs(plane.position.x)>6.2)finish();items.filter(i=>i.o.position.z>13).forEach(i=>world.remove(i.o));items=items.filter(i=>i.o.position.z<=13);if(spawn>20){spawn=0;obstacle(-95)}const passed=items.filter(i=>i.kind==='building'&&!i.passed&&i.o.position.z>4);for(const i of passed){i.passed=true;score++;$('#score').textContent=score}for(let i=0;i<trail.length;i++){const q=trail[i];q.position.lerp(new THREE.Vector3(plane.position.x,plane.position.y,3+(i+1)*.35),Math.min(1,dt*(6-i*.25)));q.material.opacity=.5*(1-i/trail.length)}camera.position.x+=(plane.position.x*.22-camera.position.x)*dt*2;camera.position.y+=(5.6+plane.position.y*.12-camera.position.y)*dt*2;camera.lookAt(plane.position.x*.15,2.8,-9)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt);if(mode!=='play'){plane.position.y+=Math.sin(performance.now()*.002)*.002;plane.rotation.z=Math.sin(performance.now()*.001)*.06}renderer.render(scene,camera)}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))}$('#startBtn').onclick=begin;$('#restartBtn').onclick=begin;init()})();
</script></body></html>
