<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050b18"><title>טיסת יהודה | Yehuda Travel Group</title><style>
:root{--gold:#f4c65d;--cyan:#57dce9;--ink:#f8f6ec}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b18;color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;touch-action:none;user-select:none}canvas{display:block}.top{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 12px #000}.brand{direction:ltr;text-align:left}.brand b{display:block;color:var(--gold);font-size:11px;letter-spacing:1.7px}.brand span{color:#9fbdca;font-size:9px;letter-spacing:1px}.stats{display:flex;gap:7px}.pill{min-width:61px;padding:7px 9px;text-align:center;border-radius:14px;border:1px solid #ffffff25;background:#061328ad;backdrop-filter:blur(8px)}.pill b{display:block;color:var(--cyan);font-size:20px;line-height:1}.pill small{font-size:9px;color:#c2d0d7}.panel{position:fixed;z-index:9;inset:0;padding:20px;display:grid;place-items:center;transition:.25s;pointer-events:none}.card{pointer-events:auto;width:min(350px,92vw);padding:27px 21px 23px;text-align:center;border:1px solid #ffffff25;border-radius:26px;background:linear-gradient(155deg,#0b1d35ee,#07101eee);box-shadow:0 25px 80px #000b,inset 0 1px #ffffff18;backdrop-filter:blur(12px);animation:rise .45s ease-out}.hidden{opacity:0;visibility:hidden;transform:scale(.98)}.eyebrow{direction:ltr;color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:2px}.plane{font-size:56px;margin:9px 0 1px;filter:drop-shadow(0 8px 12px #0008);transform:rotate(-12deg)}h1{color:var(--gold);font-size:38px;letter-spacing:-1px;margin:0}.sub{font-size:14px;line-height:1.6;color:#b8cad4;margin:7px 0 18px}.startBtn{width:100%;min-height:55px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold),#eaa03b);color:#181107;font-size:18px;font-weight:900;box-shadow:0 11px 32px #e6aa3944}.startBtn:active{transform:scale(.97)}.tip{color:#7895a5;font-size:10px;margin:12px 0 0}.how{display:flex;justify-content:center;gap:8px;margin:0 0 17px}.how span{padding:7px 9px;border:1px solid #ffffff13;border-radius:10px;background:#ffffff09;color:#a9c0cc;font-size:10px}.result{display:flex;justify-content:center;gap:10px;margin:17px 0}.result div{width:102px;padding:10px;border:1px solid #ffffff13;background:#ffffff09;border-radius:15px}.result b{display:block;color:var(--gold);font-size:28px}.result span{font-size:10px;color:#91a9b8}.newbest{height:18px;color:var(--cyan);font-size:12px;font-weight:bold}.dragHint{position:fixed;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#06132899;color:#b7d0d9;font-size:10px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}.dragHint.show{opacity:1}@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}@media(max-height:630px){.card{padding:18px}.plane{font-size:42px;margin:2px}h1{font-size:31px}.sub{margin:4px 0 10px}.how{margin-bottom:10px}}
</style></head><body>
<div class="top"><div class="brand"><b>YEHUDA TRAVEL GROUP</b><span>FLY SMART • TRAVEL FAR</span></div><div class="stats"><div class="pill"><b id="score">0</b><small>ניקוד</small></div><div class="pill"><b id="best">0</b><small>שיא</small></div></div></div><div class="dragHint" id="hint">גרור עם האגודל כדי להטיס ✈️</div>
<div class="panel" id="start"><div class="card"><div class="eyebrow">3D ENDLESS FLIGHT</div><div class="plane">✈️</div><h1>טיסת יהודה</h1><p class="sub">טוסו בין המגדלים, עברו בשערי הזהב<br>והגיעו הכי רחוק שאפשר.</p><div class="how"><span>↔️ ימינה ושמאלה</span><span>↕️ למעלה ולמטה</span></div><button class="startBtn" id="startBtn">להמראה 🚀</button><p class="tip">משחק תלת־ממד • מיועד לטלפון</p></div></div>
<div class="panel hidden" id="over"><div class="card"><div class="eyebrow">הטיסה הסתיימה</div><div class="plane">🛬</div><h1 style="font-size:31px">נחיתה בעיר</h1><div class="result"><div><b id="final">0</b><span>ניקוד</span></div><div><b id="finalBest">0</b><span>שיא</span></div></div><div class="newbest" id="newbest"></div><button class="startBtn" id="restartBtn">משחק חדש ↻</button><p class="tip">עוד טיסה אחת ודי 😉</p></div></div>
<canvas id="game"></canvas><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s),start=$('#start'),over=$('#over'),hint=$('#hint');let W,H,D,mode='ready',score=0,best=+(localStorage.getItem('yehuda3DBest')||0),px=0,py=0,targetX=0,targetY=0,drag=false,last=0,world=[],stars=[];$('#best').textContent=best;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.position='fixed';c.style.inset=0;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0);stars=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H*.55,r:Math.random()*1.3+.3}))}function reset(){score=0;px=targetX=0;py=targetY=0;world=[];$('#score').textContent=0;for(let z=16;z<115;z+=15)spawn(z)}function spawn(z){let side=Math.random()>.5?1:-1;world.push({type:'b',x:side*(2.1+Math.random()*2.6),z,w:1.2+Math.random(),h:2.6+Math.random()*3.6,pass:false});if(Math.random()>.28)world.push({type:'r',x:-side*(Math.random()*2.4),y:1+Math.random()*2.6,z:z+7,hit:false})}function begin(){reset();mode='play';start.classList.add('hidden');over.classList.add('hidden');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),1800)}function end(){if(mode!=='play')return;mode='over';if(score>best){best=score;localStorage.setItem('yehuda3DBest',best);$('#newbest').textContent='✨ שיא חדש!'}else $('#newbest').textContent='';$('#best').textContent=best;$('#final').textContent=score;$('#finalBest').textContent=best;setTimeout(()=>over.classList.remove('hidden'),250)}function project(x,y,z){let k=Math.min(7,8.5/z),h=H*.58;return{x:W/2+x*k*W*.12,y:h-y*k*H*.11,k}}function drawBuilding(o){let a=project(o.x,0,o.z),b=project(o.x+o.w,0,o.z),t=project(o.x,o.h,o.z),tw=Math.abs(b.x-a.x),bh=a.y-t.y;if(tw<1)return;let grad=g.createLinearGradient(a.x-tw/2,t.y,a.x+tw/2,a.y);grad.addColorStop(0,'#071522');grad.addColorStop(.55,'#18374a');grad.addColorStop(1,'#06111d');g.fillStyle=grad;g.fillRect(a.x-tw/2,t.y,tw,bh);g.fillStyle='#56dce855';for(let y=t.y+9;y<a.y-5;y+=14)for(let x=a.x-tw/2+7;x<a.x+tw/2-4;x+=13)g.fillRect(x,y,3,5);g.fillStyle='#ff496a';g.beginPath();g.arc(a.x,t.y-2,Math.max(1,o.w*a.k),0,7);g.fill()}function drawRing(o){let p=project(o.x,o.y,o.z),r=2*p.k*W*.12;if(r<2)return;g.strokeStyle='#f4c65d';g.lineWidth=Math.max(2,r*.11);g.shadowColor='#f4c65d';g.shadowBlur=14;g.beginPath();g.ellipse(p.x,p.y,r,r*.68,0,0,7);g.stroke();g.shadowBlur=0;g.fillStyle='#57dce9';for(let i=0;i<4;i++){g.beginPath();g.arc(p.x+Math.cos(i*1.57)*r,p.y+Math.sin(i*1.57)*r*.68,Math.max(2,r*.06),0,7);g.fill()}}function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#061126');sky.addColorStop(.63,'#0b3040');sky.addColorStop(1,'#071019');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#d9fbff';for(const s of stars){g.globalAlpha=.25+.4*Math.sin(performance.now()*.001+s.x);g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1;let hy=H*.58;g.fillStyle='#061520';g.beginPath();g.moveTo(0,H);g.lineTo(W*.43,hy);g.lineTo(W*.57,hy);g.lineTo(W,H);g.fill();g.strokeStyle='#48d5df55';g.lineWidth=1;for(let z=8;z<100;z+=9){let l=project(-3.5,0,z),r=project(3.5,0,z);g.beginPath();g.moveTo(l.x,l.y);g.lineTo(r.x,r.y);g.stroke()}for(const x of[-3.5,0,3.5]){let n=project(x,0,7),f=project(x,0,100);g.beginPath();g.moveTo(n.x,n.y);g.lineTo(f.x,f.y);g.stroke()}for(const o of [...world].sort((a,b)=>b.z-a.z))o.type==='b'?drawBuilding(o):drawRing(o);let planeX=W/2+px*W*.07,planeY=H*.52-py*H*.075;g.save();g.translate(planeX,planeY);g.rotate((targetX-px)*-.08);g.shadowColor='#57dce9';g.shadowBlur=22;g.font=Math.max(38,W*.13)+'px Arial';g.textAlign='center';g.textBaseline='middle';g.scale(-1,1);g.fillText('✈️',0,0);g.restore();let v=g.createRadialGradient(W/2,H*.48,20,W/2,H*.48,H*.7);v.addColorStop(.55,'#0000');v.addColorStop(1,'#0009');g.fillStyle=v;g.fillRect(0,0,W,H)}function update(dt){if(mode!=='play')return;px+=(targetX-px)*Math.min(1,dt*6);py+=(targetY-py)*Math.min(1,dt*6);let sp=10+score*.18;for(const o of world){o.z-=sp*dt;if(o.type==='b'&&!o.pass&&o.z<6){o.pass=true;score++;$('#score').textContent=score}if(o.type==='b'&&o.z>4&&o.z<7&&Math.abs(px-o.x)<o.w*.62+.35&&py<o.h-1.1)end();if(o.type==='r'&&!o.hit&&o.z>4&&o.z<7){o.hit=true;if(Math.hypot(px-o.x,py-o.y)<1.25){score+=2;$('#score').textContent=score}}}world=world.filter(o=>o.z>2);let max=world.reduce((m,o)=>Math.max(m,o.z),0);while(max<110){max+=16;spawn(max)}if(Math.abs(px)>5||py<-1.3||py>4.6)end()}function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}function steer(e){targetX=(e.clientX/W-.5)*9;targetY=(.6-e.clientY/H)*8}c.addEventListener('pointerdown',e=>{if(mode==='play'){drag=true;steer(e)}});c.addEventListener('pointermove',e=>{if(drag&&mode==='play')steer(e)});addEventListener('pointerup',()=>drag=false);addEventListener('resize',resize);$('#startBtn').onclick=begin;$('#restartBtn').onclick=begin;resize();reset();requestAnimationFrame(loop)})();</script></body></html>
